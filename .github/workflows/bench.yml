name: Bench

# Benchmarks of real servers on a GitHub runner, and the report generated from them. Run by hand
# (Actions > Bench > Run workflow); the results and report come back as an artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install matplotlib
      - run: go build -o bin/quorum-server ./cmd/quorum-server
      - run: BENCH_HOST="GitHub Actions runner (ubuntu-latest)." go run ./cmd/quorum-bench -server bin/quorum-server -out bench/results.json
      - run: python bench/report.py
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench/
