name: Pages

# The demo: the simulator compiled to WebAssembly, and the page that draws it
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: |
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o site/quorum.wasm ./cmd/quorum-wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" site/ 2>/dev/null || cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
